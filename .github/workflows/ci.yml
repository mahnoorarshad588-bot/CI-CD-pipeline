name: CI Pipeline

on:
  push: 
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Files
        run: ls -la

      - name: Check HTML File
        run: test -f index.html

      - name: Check CSS File
        run: test -f style.css

      - name: Success
        run: echo "CI Pipeline Executed Successfully!"